# Official profile: all five release-bundled private process modules.
# Immutable coordinated source graph for Builder 2.1.0.
schema_version = 2
require_clean_sources = true

[distribution]
name = "unionc"
version = "0.5.0"
source = "../.union-sources/union-rust"
repository = "https://github.com/isarmg/union-rust.git"
revision = "0d24d53bd2922655b34759ae5922176f870997ce"
package = "unionc"
binary = "unionc"
output = "../dist/full"

[distribution.frontend]
directory = "web"
output = "dist"

[[module]]
id = "sentinel-monitor"
source = "../.union-sources/sentinel-monitor"
repository = "https://github.com/isarmg/sentinel-monitor.git"
revision = "ad67548d7dab752cf7edc27751c9c3561f62dd11"
package = "sentinel-monitor"
binary = "sentinel-monitor"
bundle = "."
module_auth_routes = ["media-hls"]

[[module]]
id = "photo-backup"
source = "../.union-sources/photo-backup"
repository = "https://github.com/isarmg/photo-backup.git"
revision = "41c67959ff901cdc6c5caac3e678ea8430f0ec7c"
package = "photo-backup-server"
binary = "photo-backup-server"
bundle = "."
module_auth_routes = ["upload-part", "mobile-api"]

[[module]]
id = "dufs"
source = "../.union-sources/dufs-ram"
repository = "https://github.com/isarmg/dufs-ram.git"
revision = "263778f8b34f2af77f851827fed36c924bc48b20"
package = "dufs"
binary = "dufs"
bundle = "."
module_auth_routes = []

[[module]]
id = "sunshine"
source = "../.union-sources/sunshine-worker"
repository = "https://github.com/isarmg/sunshine-worker.git"
revision = "d6e6d944c75bd2666deb2a472a874c659cbb8da6"
package = "unionc-sunshine-worker"
binary = "unionc-sunshine-worker"
bundle = "."
module_auth_routes = []

[[module]]
id = "host-monitoring"
source = "../.union-sources/host-monitoring"
repository = "https://github.com/isarmg/host-monitoring.git"
revision = "25815b16e8d1e5c46758bed99ea03045011d3520"
package = "union-host-monitoring-worker"
binary = "union-host-monitoring-worker"
bundle = "host-monitoring-worker"
module_auth_routes = [
  "agent-report",
  "pairing-create",
  "pairing-read",
  "pairing-status",
  "agent-activate",
]
