# Official profile: Union + every supported private process module.
# Locked source revisions for the Union 0.4.0 release line.
schema_version = 1
require_clean_sources = true

[distribution]
name = "unionc"
version = "0.4.0"
source = "../.union-sources/union-rust"
repository = "https://github.com/isarmg/union-rust.git"
revision = "63af6330f3888c9418f61cd9e7265fc8b70db1bf"
package = "unionc"
binary = "unionc"
base_features = []
output = "../dist/full"

[distribution.frontend]
directory = "web"
output = "dist"
install = "share/union/web"

[[module]]
id = "sentinel-monitor"
source = "../.union-sources/sentinel-monitor"
repository = "https://github.com/isarmg/sentinel-monitor.git"
revision = "47dfa54ee2f441eb91918ca61d56e650c431ca66"
package = "sentinel-monitor"
binary = "sentinel-monitor"
union_feature = "module-sentinel-monitor"
cargo_features = []

[module.frontend]
directory = "web"
output = "dist"
install = "share/union/modules/sentinel-monitor"

[module.runtime]
bind = "127.0.0.1:18101"
gateway_path = "/modules/sentinel-monitor"
liveness_path = "/health/live"
readiness_path = "/health/ready"

[[module]]
id = "photo-backup"
source = "../.union-sources/photo-backup"
repository = "https://github.com/isarmg/photo-backup.git"
revision = "934708b57e00978a8ccaaae197005a8a9aca5e74"
package = "photo-backup-server"
binary = "photo-backup-server"
union_feature = "module-photo-backup"
cargo_features = []

[module.runtime]
bind = "127.0.0.1:18102"
gateway_path = "/modules/photo-backup"
liveness_path = "/health/live"
readiness_path = "/health/ready"

[[module]]
id = "dufs"
source = "../.union-sources/dufs-ram"
repository = "https://github.com/isarmg/dufs-ram.git"
revision = "af3b381fad4ee615c9604f2b119656f635e744ad"
package = "dufs"
binary = "dufs"
union_feature = "module-dufs"
cargo_features = []

[module.runtime]
bind = "127.0.0.1:18103"
gateway_path = "/modules/dufs"
liveness_path = "/__dufs__/health"
readiness_path = "/__dufs__/ready"

[[module]]
id = "sunshine"
source = "../.union-sources/union-rust"
repository = "https://github.com/isarmg/union-rust.git"
revision = "63af6330f3888c9418f61cd9e7265fc8b70db1bf"
package = "unionc-sunshine-worker"
binary = "unionc-sunshine-worker"
union_feature = "module-sunshine"
cargo_features = []

[module.runtime]
bind = "127.0.0.1:18104"
gateway_path = "/modules/sunshine"
liveness_path = "/health/live"
readiness_path = "/health/ready"

[[module]]
id = "host-monitoring"
source = "../.union-sources/union-rust"
repository = "https://github.com/isarmg/union-rust.git"
revision = "63af6330f3888c9418f61cd9e7265fc8b70db1bf"
package = "union-host-monitoring-worker"
binary = "union-host-monitoring-worker"
union_feature = "module-host-monitoring"
cargo_features = []

[module.runtime]
bind = "127.0.0.1:18105"
gateway_path = "/modules/host-monitoring"
liveness_path = "/health/live"
readiness_path = "/health/ready"
