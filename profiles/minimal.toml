# Official profile: Union Core and Web Shell, with no bundled business modules.
# Immutable coordinated source graph for Builder 2.1.0.
schema_version = 2
require_clean_sources = true

[distribution]
name = "unionc"
version = "0.5.0"
source = "../.union-sources/union-rust"
repository = "https://github.com/isarmg/union-rust.git"
revision = "0d24d53bd2922655b34759ae5922176f870997ce"
package = "unionc"
binary = "unionc"
output = "../dist/minimal"

[distribution.frontend]
directory = "web"
output = "dist"
