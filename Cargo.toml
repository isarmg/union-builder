[package]
name = "union-builder"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Reproducible compile-time module selector and release assembler for Union"
authors = ["sarmg <isarmg@163.com>"]
license = "Apache-2.0"
repository = "https://github.com/isarmg/union-builder"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
toml = "0.9"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
