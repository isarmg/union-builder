schema_version = 2
require_clean_sources = true

# Replace all-zero revisions before use. A profile selects what the release contains; it never
# selects Cargo features and it does not imply that a bundled module is enabled at runtime.
[distribution]
name = "unionc"
version = "0.5.0"
source = ".union-sources/union-rust"
repository = "https://github.com/isarmg/union-rust.git"
revision = "0000000000000000000000000000000000000000"
package = "unionc"
binary = "unionc"
output = "dist"

[distribution.frontend]
directory = "web"
output = "dist"

[[module]]
id = "photo-backup"
source = ".union-sources/photo-backup"
repository = "https://github.com/isarmg/photo-backup.git"
revision = "0000000000000000000000000000000000000000"
package = "photo-backup-server"
binary = "photo-backup-server"
bundle = "."
module_auth_routes = ["upload-part", "mobile-api"]

# Optional: when a module owns an npm frontend build, Builder builds it separately and uses this
# output as modules/<id>/frontend. Otherwise checked-in bundle frontend assets are packaged.
# [module.frontend]
# directory = "module-web"
# output = "dist"
