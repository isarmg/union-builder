name: Build Union Distribution

on:
  workflow_call:
    inputs:
      config:
        description: Path to the composition manifest in the caller repository
        required: true
        type: string
      artifact-name:
        description: Uploaded artifact name
        required: false
        default: union-distribution
        type: string
  workflow_dispatch:
    inputs:
      config:
        description: Path to the composition manifest in this repository
        required: true
        default: profiles/full-transition.toml
        type: string
      artifact-name:
        description: Uploaded artifact name
        required: true
        default: union-distribution
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out composition repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: workspace
          persist-credentials: false
      - name: Check out Union Builder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: isarmg/union-builder
          ref: v0.2.0
          path: tool
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
      - name: Build Union Builder
        run: cargo build --locked --release --manifest-path tool/Cargo.toml
      - name: Assemble exact Union graph
        run: >-
          tool/target/release/union-builder build
          --config "workspace/${{ inputs.config }}"
          --output "$RUNNER_TEMP/union-distribution"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs['artifact-name'] }}
          path: ${{ runner.temp }}/union-distribution
          if-no-files-found: error
