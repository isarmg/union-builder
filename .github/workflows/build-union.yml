name: Build Union Distribution

on:
  workflow_call:
    inputs:
      server-target:
        description: Union server distribution target (linux-amd64 or linux-arm64)
        required: true
        type: string
      config:
        description: Caller-relative custom manifest; mutually exclusive with profile
        required: false
        default: ""
        type: string
      profile:
        description: Official release inclusion profile (minimal, storage, monitoring or full); mutually exclusive with config
        required: false
        default: ""
        type: string
      artifact-name-prefix:
        description: Prefix for the target-qualified uploaded artifact name
        required: false
        default: union-distribution
        type: string
      materialize-caller-source:
        description: Replace Union-owned profile entries with the verified Union caller checkout
        required: false
        default: false
        type: boolean
      caller-revision:
        description: Explicit full caller Git ID; required when materialize-caller-source is true
        required: false
        default: ""
        type: string
      builder-revision:
        description: Immutable 40-character union-builder Git ID; required for external callers
        required: false
        default: ""
        type: string
    outputs:
      server-target:
        description: Validated logical Linux server target
        value: ${{ jobs.build.outputs.server_target }}
      rust-target:
        description: Rust GNU target compiled natively by the selected runner
        value: ${{ jobs.build.outputs.rust_target }}
      artifact-name:
        description: Target-qualified uploaded artifact name
        value: ${{ jobs.build.outputs.artifact_name }}
      archive-name:
        description: Target-qualified tar file inside the artifact
        value: ${{ jobs.build.outputs.archive_name }}
  workflow_dispatch:
    inputs:
      server-target:
        description: Union Linux server distribution target
        required: true
        default: linux-amd64
        type: choice
        options:
          - linux-amd64
          - linux-arm64
      config:
        description: Repository-relative custom manifest; select custom below when using this
        required: false
        default: ""
        type: string
      profile:
        description: Official Builder profile, or custom to use config
        required: true
        default: full
        type: choice
        options:
          - full
          - minimal
          - storage
          - monitoring
          - custom
      artifact-name-prefix:
        description: Prefix for the target-qualified uploaded artifact name
        required: true
        default: union-distribution
        type: string
      materialize-caller-source:
        description: Union-only caller materialization (normally false for Builder dispatches)
        required: true
        default: false
        type: boolean
      caller-revision:
        description: Full caller Git ID when caller materialization is enabled
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs['server-target'] == 'linux-arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    outputs:
      server_target: ${{ steps.server_target.outputs.server_target }}
      rust_target: ${{ steps.server_target.outputs.rust_target }}
      artifact_name: ${{ steps.server_target.outputs.artifact_name }}
      archive_name: ${{ steps.server_target.outputs.archive_name }}
    steps:
      - name: Resolve and prove the native Linux server target
        id: server_target
        shell: bash
        env:
          SERVER_TARGET: ${{ inputs['server-target'] }}
          ARTIFACT_NAME_PREFIX: ${{ inputs['artifact-name-prefix'] }}
        run: |
          set -euo pipefail

          if [[ ! "$ARTIFACT_NAME_PREFIX" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "artifact-name-prefix must contain only letters, digits, dot, underscore and hyphen" >&2
            exit 2
          fi
          case "$SERVER_TARGET" in
            linux-amd64)
              expected_machine=x86_64
              rust_target=x86_64-unknown-linux-gnu
              ;;
            linux-arm64)
              expected_machine=aarch64
              rust_target=aarch64-unknown-linux-gnu
              ;;
            *)
              echo "unsupported Union server target: $SERVER_TARGET" >&2
              exit 2
              ;;
          esac
          if [[ "$(uname -s)" != Linux || "$(uname -m)" != "$expected_machine" ]]; then
            echo "server distributions must be assembled on their native Linux architecture" >&2
            exit 2
          fi

          echo "server_target=$SERVER_TARGET" >> "$GITHUB_OUTPUT"
          echo "rust_target=$rust_target" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$ARTIFACT_NAME_PREFIX-$SERVER_TARGET" >> "$GITHUB_OUTPUT"
          echo "archive_name=union-distribution-$SERVER_TARGET.tar" >> "$GITHUB_OUTPUT"
      - name: Check out composition repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: workspace
          persist-credentials: false
      - name: Resolve an immutable Union Builder source revision
        id: builder-source
        shell: bash
        env:
          CALLER_REPOSITORY: ${{ github.repository }}
          BUILDER_REVISION: ${{ inputs['builder-revision'] }}
          WORKFLOW_REVISION: ${{ github.sha }}
          CALLED_WORKFLOW_REF: ${{ job.workflow_ref }}
          CALLED_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail

          if [[ "$CALLER_REPOSITORY" == "isarmg/union-builder" ]]; then
            if [[ -n "$BUILDER_REVISION" && "$BUILDER_REVISION" != "$WORKFLOW_REVISION" ]]; then
              echo "Builder self-runs may only use github.sha as builder-revision" >&2
              exit 2
            fi
            revision="$WORKFLOW_REVISION"
          else
            if [[ ! "$BUILDER_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
              echo "external callers must provide builder-revision as a canonical lowercase 40-character Git object ID" >&2
              exit 2
            fi
            expected_workflow_ref="isarmg/union-builder/.github/workflows/build-union.yml@$BUILDER_REVISION"
            if [[ "$CALLED_WORKFLOW_REF" != "$expected_workflow_ref" ]]; then
              echo "external callers must use the same full Builder commit in uses@<sha> and builder-revision" >&2
              exit 2
            fi
            if [[ "$CALLED_WORKFLOW_SHA" != "$BUILDER_REVISION" ]]; then
              echo "the resolved called-workflow commit does not match builder-revision" >&2
              exit 2
            fi
            revision="$BUILDER_REVISION"
          fi

          if [[ ! "$revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "resolved Builder revision is not a canonical lowercase full Git object ID" >&2
            exit 2
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - name: Check out Union Builder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: isarmg/union-builder
          ref: ${{ steps.builder-source.outputs.revision }}
          path: tool
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
      - name: Install pinned Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.7.0
          check-latest: false
      - name: Build Union Builder
        run: cargo build --locked --release --manifest-path tool/Cargo.toml
      - name: Select exactly one composition manifest
        id: composition
        env:
          INPUT_CONFIG: ${{ inputs.config }}
          INPUT_PROFILE: ${{ inputs.profile }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          config="$INPUT_CONFIG"
          profile="$INPUT_PROFILE"
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$profile" == "custom" ]]; then
            profile=""
          fi

          if [[ -n "$config" && -n "$profile" ]]; then
            echo "config and profile are mutually exclusive" >&2
            exit 2
          fi
          if [[ -z "$config" && -z "$profile" ]]; then
            echo "exactly one of config or profile is required" >&2
            exit 2
          fi

          if [[ -n "$profile" ]]; then
            case "$profile" in
              minimal|storage|monitoring|full) ;;
              *)
                echo "unsupported official profile: $profile" >&2
                exit 2
                ;;
            esac
            selected="$GITHUB_WORKSPACE/tool/profiles/$profile.toml"
          else
            if [[ "$config" == /* || "$config" == ".." || "$config" == ../* || "$config" == */../* || "$config" == */.. ]]; then
              echo "config must stay inside the caller repository" >&2
              exit 2
            fi
            selected="$GITHUB_WORKSPACE/workspace/$config"
          fi

          if [[ ! -f "$selected" ]]; then
            echo "composition manifest does not exist: $selected" >&2
            exit 2
          fi
          echo "config=$selected" >> "$GITHUB_OUTPUT"
      - name: Materialize the explicitly authorized Union caller checkout
        id: materialization
        shell: bash
        env:
          ENABLED: ${{ inputs['materialize-caller-source'] }}
          CALLER_REVISION: ${{ inputs['caller-revision'] }}
          CALLER_REPOSITORY: ${{ github.repository }}
          WORKFLOW_REVISION: ${{ github.sha }}
          SELECTED_CONFIG: ${{ steps.composition.outputs.config }}
          INPUT_CONFIG: ${{ inputs.config }}
          INPUT_PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail

          if [[ "$ENABLED" != "true" ]]; then
            if [[ "$CALLER_REPOSITORY" == "isarmg/union-rust" ]]; then
              echo "isarmg/union-rust callers must materialize their exact caller checkout" >&2
              exit 2
            fi
            if [[ -n "$CALLER_REVISION" ]]; then
              echo "caller-revision requires materialize-caller-source=true" >&2
              exit 2
            fi
            echo "config=$SELECTED_CONFIG" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$CALLER_REPOSITORY" != "isarmg/union-rust" ]]; then
            echo "caller materialization is restricted to isarmg/union-rust" >&2
            exit 2
          fi
          if [[ -n "$INPUT_CONFIG" || -z "$INPUT_PROFILE" ]]; then
            echo "caller materialization requires an official Builder profile, not a caller config" >&2
            exit 2
          fi
          if [[ ! "$CALLER_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "caller-revision must be a canonical lowercase 40-character Git object ID" >&2
            exit 2
          fi
          if [[ "$CALLER_REVISION" != "$WORKFLOW_REVISION" ]]; then
            echo "caller-revision must equal github.sha" >&2
            exit 2
          fi

          materialized="${SELECTED_CONFIG}.union-caller-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.toml"
          tool/target/release/union-builder materialize \
            --config "$SELECTED_CONFIG" \
            --caller-repository "https://github.com/isarmg/union-rust.git" \
            --caller-source "$GITHUB_WORKSPACE/workspace" \
            --caller-revision "$CALLER_REVISION" \
            --output "$materialized"
          echo "config=$materialized" >> "$GITHUB_OUTPUT"
      - name: Assemble Core, Web Shell and selected module packages via Builder CLI
        run: >-
          tool/target/release/union-builder build
          --config "${{ steps.materialization.outputs.config }}"
          --server-target "${{ steps.server_target.outputs.server_target }}"
          --output "$RUNNER_TEMP/union-distribution"
      - name: Verify and wrap the distribution without losing Unix modes
        shell: bash
        run: |
          set -euo pipefail
          tool/target/release/union-builder verify \
            --release "$RUNNER_TEMP/union-distribution" \
            --server-target "${{ steps.server_target.outputs.server_target }}"
          tar --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 --group=0 --numeric-owner \
            -cf "$RUNNER_TEMP/${{ steps.server_target.outputs.archive_name }}" \
            -C "$RUNNER_TEMP" union-distribution
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.server_target.outputs.artifact_name }}
          # upload-artifact's ZIP transport does not preserve executable bits. The inner tar does.
          path: ${{ runner.temp }}/${{ steps.server_target.outputs.archive_name }}
          if-no-files-found: error
