name: Release Union Builder

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  HOST_AGENT_REVISION: d80053fcd7edc924b2890784f50be3864e7e1585
  HOST_AGENT_VERSION: 0.5.0
  PHOTO_CLIENT_REVISION: 41c67959ff901cdc6c5caac3e678ea8430f0ec7c
  PHOTO_CLIENT_VERSION: 0.2.0

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-release-ref:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a version-matched tag from main
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n --fixed-string 'TODO(release)' profiles; then
            echo "official profiles still contain release pin placeholders" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            echo "Manual validation build: no GitHub Release will be created."
            exit 0
          fi
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be strict vMAJOR.MINOR.PATCH: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          package_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          if [[ "$GITHUB_REF_NAME" != "v$package_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo version $package_version" >&2
            exit 1
          fi
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          release_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          if ! git merge-base --is-ancestor "$release_commit" refs/remotes/origin/main; then
            echo "Release commit $release_commit is not part of main history." >&2
            exit 1
          fi

  verify:
    needs: verify-release-ref
    uses: ./.github/workflows/ci.yml

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            asset: union-builder-linux-x86_64
          - os: macos-26
            target: aarch64-apple-darwin
            asset: union-builder-macos-aarch64
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            asset: union-builder-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          targets: ${{ matrix.target }}
      - name: Install musl compiler
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Verify built CLI version
        if: startsWith(github.ref, 'refs/tags/v') && runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          "target/${{ matrix.target }}/release/union-builder" --version \
            | grep -Fx "union-builder ${GITHUB_REF_NAME#v}"
      - name: Verify built CLI version on Windows
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Windows'
        shell: pwsh
        run: |
          $actual = & "target/${{ matrix.target }}/release/union-builder.exe" --version
          $expected = "union-builder " + $env:GITHUB_REF_NAME.Substring(1)
          if ($actual -ne $expected) {
            throw "unexpected Builder version: $actual"
          }
      - name: Stage Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/union-builder" "dist/${{ matrix.asset }}"
          chmod 0755 "dist/${{ matrix.asset }}"
      - name: Stage Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/union-builder.exe" "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  build-host-agent-linux:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: isarmg/host-monitoring
          ref: ${{ env.HOST_AGENT_REVISION }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
      - name: Verify immutable Host Agent source and version
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HOST_AGENT_REVISION"
          cargo pkgid --locked -p unionc-agent | grep -F "#unionc-agent@$HOST_AGENT_VERSION"
      - name: Build native Linux Agent
        run: cargo build --locked --release -p unionc-agent --bin unionc-agent
      - name: Install pinned nFPM and build deb/rpm
        shell: bash
        env:
          NFPM_ARCH: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
          NFPM_BIN="$(go env GOPATH)/bin/nfpm" \
            sh agent/packaging/linux/build-packages.sh
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unionc-agent-linux-${{ matrix.architecture }}
          path: dist/*
          if-no-files-found: error

  build-host-agent-windows:
    needs: verify
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: isarmg/host-monitoring
          ref: ${{ env.HOST_AGENT_REVISION }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          targets: x86_64-pc-windows-msvc
      - name: Verify source, build native Agent programs, and create MSI
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ((git rev-parse HEAD) -ne $env:HOST_AGENT_REVISION) { throw "Host source mismatch" }
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $agent = @($metadata.packages | Where-Object name -eq "unionc-agent")
          if ($agent.Count -ne 1 -or $agent[0].version -ne $env:HOST_AGENT_VERSION) {
            throw "Host Agent version mismatch"
          }
          cargo build --locked --release -p unionc-agent --target x86_64-pc-windows-msvc `
            --bin unionc-agent --bin unionc-agent-maintenance --bin unionc-agent-tray
          if ($LASTEXITCODE -ne 0) { throw "Agent build failed" }
          cmd /c agent\packaging\windows\wix\build-msi.cmd `
            $env:HOST_AGENT_VERSION `
            target\x86_64-pc-windows-msvc\release\unionc-agent.exe `
            target\x86_64-pc-windows-msvc\release\unionc-agent-maintenance.exe `
            target\x86_64-pc-windows-msvc\release\unionc-agent-tray.exe
          if ($LASTEXITCODE -ne 0) { throw "MSI build failed" }
          $packages = @(Get-ChildItem agent\packaging\windows\wix\bin\x64\Release -File -Filter *.msi)
          if ($packages.Count -ne 1) { throw "Expected exactly one MSI, found $($packages.Count)" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $packages[0].FullName `
            "dist/unionc-agent-$env:HOST_AGENT_VERSION-windows-amd64-unsigned.msi"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unionc-agent-windows-amd64
          path: dist/*
          if-no-files-found: error

  build-host-agent-macos-and-apple-mobile:
    needs: verify
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: isarmg/host-monitoring
          ref: ${{ env.HOST_AGENT_REVISION }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          targets: aarch64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim
      - name: Verify source and mobile library targets
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HOST_AGENT_REVISION"
          cargo pkgid --locked -p unionc-agent | grep -F "#unionc-agent@$HOST_AGENT_VERSION"
          cargo check --locked -p unionc-agent --target aarch64-apple-ios \
            --lib --no-default-features
          cargo check --locked -p unionc-agent --target aarch64-apple-ios-sim \
            --lib --no-default-features
      - name: Build native macOS Agent and unsigned installer
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release -p unionc-agent --target aarch64-apple-darwin \
            --bin unionc-agent
          mkdir -p dist
          BINARY="$PWD/target/aarch64-apple-darwin/release/unionc-agent" \
            VERSION="$HOST_AGENT_VERSION" \
            OUTPUT="$PWD/dist/unionc-agent-$HOST_AGENT_VERSION-macos-arm64-unsigned.pkg" \
            sh agent/packaging/macos/build-pkg.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unionc-agent-macos-arm64
          path: dist/*
          if-no-files-found: error

  build-host-agent-mobile-sdk:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: isarmg/host-monitoring
          ref: ${{ env.HOST_AGENT_REVISION }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          targets: aarch64-linux-android
      - name: Validate Android library and create reproducible mobile SDK source archive
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HOST_AGENT_REVISION"
          cargo check --locked -p unionc-agent --target aarch64-linux-android \
            --lib --no-default-features
          root="unionc-agent-mobile-sdk-$HOST_AGENT_VERSION"
          mkdir -p "stage/$root" dist
          git archive --format=tar HEAD \
            Cargo.toml Cargo.lock LICENSE-APACHE NOTICE agent protocol \
            | tar -xf - -C "stage/$root"
          jq -n \
            --arg version "$HOST_AGENT_VERSION" \
            --arg revision "$HOST_AGENT_REVISION" \
            '{schema_version:1,id:"host-monitoring-agent-mobile-sdk",version:$version,source_revision:$revision,delivery:"embedded-rust-source-sdk",targets:["aarch64-linux-android","aarch64-apple-ios","aarch64-apple-ios-sim"],limitations:["no Android/iOS application shell","no APK or IPA","native host owns permissions, credentials, HTTPS, scheduling and background lifecycle"]}' \
            > "stage/$root/SOURCE.json"
          source_date_epoch="$(git show -s --format=%ct HEAD)"
          tar --sort=name --mtime="@$source_date_epoch" --owner=0 --group=0 --numeric-owner \
            -C stage -cf - "$root" | gzip -n > "dist/$root.tar.gz"
          tar -tzf "dist/$root.tar.gz" | grep -Fx "$root/SOURCE.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unionc-agent-mobile-sdk
          path: dist/*
          if-no-files-found: error

  build-photo-android-client:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: isarmg/photo-backup
          ref: ${{ env.PHOTO_CLIENT_REVISION }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          targets: aarch64-linux-android
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "9.5.0"
      - name: Build arm64 unsigned release APK
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PHOTO_CLIENT_REVISION"
          grep -F 'version = "0.2.0"' Cargo.toml
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          cargo install cargo-ndk --locked
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          cargo ndk -t arm64-v8a -o android/app/src/main/jniLibs \
            build -p photo-backup-mobile --release
          gradle -p android assembleRelease
          source_apk=android/app/build/outputs/apk/release/app-release-unsigned.apk
          test -f "$source_apk"
          unzip -l "$source_apk" | grep -F 'lib/arm64-v8a/libphoto_backup_mobile.so'
          mkdir -p dist
          cp "$source_apk" \
            "dist/photo-backup-$PHOTO_CLIENT_VERSION-android-arm64-unsigned.apk"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: photo-backup-android-arm64
          path: dist/*
          if-no-files-found: error

  build-photo-apple-client:
    needs: verify
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: isarmg/photo-backup
          ref: ${{ env.PHOTO_CLIENT_REVISION }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - name: Build unsigned iOS/iPadOS device app
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PHOTO_CLIENT_REVISION"
          grep -F 'version = "0.2.0"' Cargo.toml
          brew install xcodegen
          sh scripts/build-ios-rust.sh
          (cd ios && xcodegen generate)
          xcodebuild -project ios/PhotoBackup.xcodeproj -scheme PhotoBackup \
            -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath ios/DerivedData build
          app=ios/DerivedData/Build/Products/Release-iphoneos/PhotoBackup.app
          test -d "$app"
          test "$(plutil -extract CFBundleIdentifier raw "$app/Info.plist")" = \
            org.sarmg.photobackup
          mkdir -p dist
          tar -C "$(dirname "$app")" -czf \
            "dist/photo-backup-$PHOTO_CLIENT_VERSION-ios-ipados-arm64-unsigned-app.tar.gz" \
            "$(basename "$app")"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: photo-backup-ios-ipados-arm64
          path: dist/*
          if-no-files-found: error

  validate-full-bundled-distribution:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        server_target:
          - linux-amd64
          - linux-arm64
    uses: ./.github/workflows/build-union.yml
    with:
      profile: full
      server-target: ${{ matrix.server_target }}
      artifact-name-prefix: union-full-validation

  validate-release-assets:
    needs:
      - build
      - build-host-agent-linux
      - build-host-agent-windows
      - build-host-agent-macos-and-apple-mobile
      - build-host-agent-mobile-sdk
      - build-photo-android-client
      - build-photo-apple-client
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: union-builder-*
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: unionc-agent-*
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: photo-backup-*
          path: release-assets
          merge-multiple: true
      - name: Validate the exact release asset set and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cp companions/clients-v1.json release-assets/COMPANION-ASSETS.json
          cd release-assets
          find . -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort > "$RUNNER_TEMP/actual-assets"
          printf '%s\n' \
            COMPANION-ASSETS.json \
            photo-backup-0.2.0-android-arm64-unsigned.apk \
            photo-backup-0.2.0-ios-ipados-arm64-unsigned-app.tar.gz \
            union-builder-linux-x86_64 \
            union-builder-macos-aarch64 \
            union-builder-windows-x86_64.exe \
            unionc-agent-0.5.0-macos-arm64-unsigned.pkg \
            unionc-agent-0.5.0-windows-amd64-unsigned.msi \
            unionc-agent-0.5.0.aarch64.rpm \
            unionc-agent-0.5.0.x86_64.rpm \
            unionc-agent_0.5.0_amd64.deb \
            unionc-agent_0.5.0_arm64.deb \
            unionc-agent-mobile-sdk-0.5.0.tar.gz \
            | LC_ALL=C sort > "$RUNNER_TEMP/expected-assets"
          cmp "$RUNNER_TEMP/expected-assets" "$RUNNER_TEMP/actual-assets"
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' \
            | sort -z | xargs -0 sha256sum > SHA256SUMS
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: union-builder-release-assets
          path: release-assets/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - validate-release-assets
      - validate-full-bundled-distribution
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: union-builder-release-assets
          path: dist
      - name: Reverify checksums and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check SHA256SUMS
          gh release create "$GITHUB_REF_NAME" ./* \
            --verify-tag --generate-notes --title "Union Builder ${GITHUB_REF_NAME#v}" \
            --notes "Builder CLI and centrally published companion assets. Desktop Agent packages, Android APK and Apple app archive are unsigned; the Host mobile asset is an embedded Rust source SDK, not an APK/IPA. These assets are architecture/build milestones and are not production signing or store-readiness evidence."
