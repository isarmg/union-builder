name: Release Union Builder

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-release-ref:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a version-matched tag from main
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            echo "Manual validation build: no GitHub Release will be created."
            exit 0
          fi
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be strict vMAJOR.MINOR.PATCH: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          package_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          if [[ "$GITHUB_REF_NAME" != "v$package_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo version $package_version" >&2
            exit 1
          fi
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          release_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          if ! git merge-base --is-ancestor "$release_commit" refs/remotes/origin/main; then
            echo "Release commit $release_commit is not part of main history." >&2
            exit 1
          fi

  verify:
    needs: verify-release-ref
    uses: ./.github/workflows/ci.yml

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            asset: union-builder-linux-x86_64
          - os: macos-26
            target: aarch64-apple-darwin
            asset: union-builder-macos-aarch64
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            asset: union-builder-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          targets: ${{ matrix.target }}
      - name: Install musl compiler
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Verify built CLI version
        if: startsWith(github.ref, 'refs/tags/v') && runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          "target/${{ matrix.target }}/release/union-builder" --version \
            | grep -Fx "union-builder ${GITHUB_REF_NAME#v}"
      - name: Verify built CLI version on Windows
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Windows'
        shell: pwsh
        run: |
          $actual = & "target/${{ matrix.target }}/release/union-builder.exe" --version
          $expected = "union-builder " + $env:GITHUB_REF_NAME.Substring(1)
          if ($actual -ne $expected) {
            throw "unexpected Builder version: $actual"
          }
      - name: Stage Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/union-builder" "dist/${{ matrix.asset }}"
          chmod 0755 "dist/${{ matrix.asset }}"
      - name: Stage Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/union-builder.exe" "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  validate-full-distribution:
    needs: verify
    uses: ./.github/workflows/build-union.yml
    with:
      profile: full
      artifact-name: union-full-validation

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, validate-full-distribution]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: union-builder-*
          path: dist
          merge-multiple: true
      - name: Generate checksums and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd dist
          checksum_file="$RUNNER_TEMP/union-builder-SHA256SUMS"
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' \
            | sort -z | xargs -0 sha256sum > "$checksum_file"
          mv "$checksum_file" SHA256SUMS
          sha256sum --check SHA256SUMS
          gh release create "$GITHUB_REF_NAME" ./* \
            --verify-tag --generate-notes --title "Union Builder ${GITHUB_REF_NAME#v}"
